[package]
name = "swiftdl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
indicatif = "0.18.6"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
