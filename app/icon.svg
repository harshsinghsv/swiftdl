<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7F83F8"/>
      <stop offset="1" stop-color="#4B44DC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#shine)"/>
  <rect x="68" y="68" width="888" height="888" rx="216" fill="none" stroke="url(#edge)" stroke-width="8"/>
  <!-- two chevrons: the faded one trails, giving motion -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="86">
    <path d="M340 286 512 452 684 286" opacity=".5"/>
    <path d="M340 468 512 634 684 468"/>
  </g>
  <rect x="330" y="712" width="364" height="78" rx="39" fill="#FFFFFF"/>
</svg>
