<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwiftDL launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  /* Real material, framed like a screen recording: the pages are captures of
     the real sites (capture.mjs), and the SwiftDL windows are the app's own UI
     (app/ui) running in its preview mode, clicked and fed frame by frame.
     Everything is laid out in 1920x1080 screen pixels; #cam zooms and pans. */
  :root { --ink: #17171c; --muted: #6c6e78; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e9ecf3; font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }

  /* wallpaper: soft light, out-of-focus colour, fine grain */
  .wall { position: absolute; inset: -80px; background: #eef0f6; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .grain { position: absolute; inset: 0; opacity: .18; mix-blend-mode: soft-light; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>"); }

  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

  /* Chrome (light, macOS) */
  .chrome { left: 240px; top: 60px; width: 1440px; height: 944px; border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.08), 0 30px 80px -10px rgba(20,24,40,.38); transform-origin: 50% 70%; }
  .strip { height: 42px; background: #e3e7ed; position: relative; display: flex; align-items: flex-end; padding-left: 84px; }
  .lights { position: absolute; left: 16px; top: 15px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  .tab { position: relative; height: 34px; width: 240px; padding: 0 12px; display: flex; align-items: center; gap: 9px; font: 12.5px/1 Inter, system-ui; color: #1f1f1f; }
  .tab.on { background: #fff; border-radius: 9px 9px 0 0; }
  .tab.on::before, .tab.on::after { content: ""; position: absolute; bottom: 0; width: 9px; height: 9px; }
  .tab.on::before { left: -9px; background: radial-gradient(circle at 0 0, transparent 9px, #fff 9.5px); }
  .tab.on::after { right: -9px; background: radial-gradient(circle at 100% 0, transparent 9px, #fff 9.5px); }
  .tab img { width: 16px; height: 16px; border-radius: 3px; }
  .tab .x { margin-left: auto; width: 16px; height: 16px; color: #5f6368; }
  .tab.off { color: #474747; }
  .tab.off + .sep { width: 1px; height: 18px; background: #b9bec7; align-self: center; }
  .newtab { width: 28px; height: 28px; margin: 0 0 3px 6px; display: grid; place-items: center; color: #474747; }
  .bar { height: 42px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #fff; }
  .ib { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #474747; flex: none; }
  .ib svg { width: 20px; height: 20px; fill: currentColor; }
  .omni { flex: 1; height: 34px; margin: 0 6px; border-radius: 17px; background: #edf0f4; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; font: 14.5px/1 Inter, system-ui; color: #1f1f1f; }
  .omni .tune { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: #474747; }
  .omni .tune svg, .omni .star svg { width: 16px; height: 16px; fill: currentColor; }
  .omni .path { color: #5f6368; }
  .omni .star { margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; color: #474747; }
  .extico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #f6b38c, #e5869f); color: #fff; font: 600 12px/26px Inter; text-align: center; }
  .viewport { position: absolute; left: 0; top: 84px; width: 1440px; height: 860px; overflow: hidden; background: #fff; }
  .viewport img { position: absolute; inset: 0; width: 1440px; height: 860px; }

  /* the extension's "Download video" button (same look as content.js) */
  .vbtn { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 8px; border-radius: 9px; background: rgba(20,21,26,.86); color: #fff;
    font: 600 12.5px/1 "Segoe UI Variable Text", "Segoe UI", system-ui; letter-spacing: -.005em; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 6px 20px rgba(0,0,0,.35); backdrop-filter: blur(14px) saturate(1.5); }

  /* SwiftDL's own windows */
  iframe { border: 0; background: transparent; }
  .dlw { width: 552px; height: 760px; transform-origin: 50% 25%; }
  .appw { left: 300px; top: 130px; width: 1320px; height: 820px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(0,0,0,.3), 0 30px 80px -10px rgba(20,24,40,.4); }

  /* cursor (macOS arrow) and click ring */
  .cursor { left: 0; top: 0; width: 26px; height: 38px; transform-origin: 2px 2px; filter: drop-shadow(0 1.5px 2.5px rgba(0,0,0,.35)); }
  .ring { width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(0,0,0,.12); }

  /* titles and captions */
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card img { width: 160px; height: 160px; margin-bottom: 40px; filter: drop-shadow(0 28px 44px rgba(20,24,50,.28)); }
  .big { font-size: 150px; font-weight: 650; letter-spacing: -.055em; line-height: 1; padding-bottom: .06em; background: linear-gradient(180deg, #121318 30%, #4b4e58); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { font-size: 42px; font-weight: 500; letter-spacing: -.025em; color: var(--muted); margin-top: 20px; }
  .caption { left: 50%; bottom: 60px; padding: 18px 34px; border-radius: 999px; background: rgba(255,255,255,.8); backdrop-filter: blur(24px) saturate(1.5);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 16px 44px -12px rgba(20,24,50,.38); font-size: 38px; font-weight: 600; letter-spacing: -.025em; white-space: nowrap; }
  .chip { left: 50%; top: 52px; padding: 11px 20px; border-radius: 999px; background: rgba(18,19,24,.85); backdrop-filter: blur(14px); color: #fff; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
</style>

  <div id="eU" style="margin-top:46px;font:500 28px 'JetBrains Mono',monospace;color:#3c3d45">github.com/harshsinghsv/swiftdl</div></div>

<script>
window.DURATION = 44;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const expo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const cubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const smooth = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const css = (el, o) => Object.assign(el.style, o);

function show(el, t, a, b, { y = 24, blur = 12, inDur = .7, outDur = .45, scale = 0, x = "" } = {}) {
  const i = expo(prog(t, a, a + inDur)), o = cubic(prog(t, b - outDur, b)), op = i * (1 - o);
  css(el, { opacity: op, visibility: op > .001 ? "visible" : "hidden", filter: op > .001 && op < .999 ? `blur(${(1 - i) * blur + o * blur * .6}px)` : "none",
    transform: `${x} translateY(${(1 - i) * y - o * y * .4}px) scale(${1 + scale * (1 - i)})` });
}
function pop(el, t, a, b) {
  const i = expo(prog(t, a, a + .45)), o = cubic(prog(t, b - .3, b)), op = i * (1 - o);
  css(el, { opacity: op, visibility: op > .001 ? "visible" : "hidden", transform: `scale(${lerp(.95, 1, i) - o * .03})` });
}
function keys(list, t) {
  if (t <= list[0][0]) return list[0].slice(1);
  for (let i = 1; i < list.length; i++) if (t <= list[i][0]) {
    const [a, b] = [list[i - 1], list[i]], k = inOut(prog(t, a[0], b[0]));
    return a.slice(1).map((v, j) => lerp(v, b[j + 1], k));
  }
  return list.at(-1).slice(1);
}

// ---------- the real UI in the frames ----------
const W1 = $("win1"), W2 = $("win2"), APP = $("appw");
const doc = (f) => f.contentDocument, win = (f) => f.contentWindow;
// Centre of an element inside a frame, in screen (pre-camera) pixels.
function inFrame(frame, sel) {
  const el = doc(frame)?.querySelector(sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return [frame.offsetLeft + r.left + r.width / 2, frame.offsetTop + r.top + r.height / 2];
}
const loaded = (f) => new Promise((r) => (f.contentDocument?.readyState === "complete" ? r() : f.addEventListener("load", r, { once: true })));
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([W1, W2, APP].map(loaded));
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await new Promise((r) => setTimeout(r, 400)); // the frames' first render (probe answers, lists)
  // The main window's sample list: the download we film has finished there.
  win(APP).__video.set(1, { status: "completed", downloaded: 6.1 * 1024 ** 3, completedAt: Date.now() - 60000 });
})();

// The engine's split, precomputed: a part that finishes takes half of the
// largest part left, exactly as SwiftDL does.
const SIM = (() => {
  let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  let segs = Array.from({ length: 8 }, (_, i) => ({ s: i / 8, p: i / 8, e: (i + 1) / 8, r: .6 + rnd() * .8 }));
  const out = [];
  for (let n = 0; n < 5000; n++) {
    const done = segs.reduce((a, x) => a + (x.p - x.s), 0);
    out.push({ done, segs: segs.map((x) => [x.s, x.p, x.e]).sort((a, b) => a[0] - b[0]) });
    if (done >= .9999) break;
    for (const x of segs) if (x.p < x.e) x.p = Math.min(x.e, x.p + .0004 * x.r);
    const busy = segs.filter((x) => x.p < x.e);
    if (busy.length < 8) {
      const big = busy.sort((a, b) => (b.e - b.p) - (a.e - a.p))[0];
      if (big && big.e - big.p > .01) { const m = big.p + (big.e - big.p) / 2; segs.push({ s: m, p: m, e: big.e, r: .6 + rnd() * .8 }); big.e = m; }
    }
  }
  return out;
})();
const simAt = (frac) => { let lo = 0, hi = SIM.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (SIM[m].done < frac) lo = m + 1; else hi = m; } return SIM[lo]; };

// ---------- the story ----------
const PAGE = [240, 144]; // where the page sits on screen
const CAM = [
  [0, 960, 540, 1], [3.4, 960, 540, 1], [4.6, 960, 540, 1], [6.6, 1240, 610, 1.3], [7.9, 1200, 560, 1.3], [8.8, 960, 500, 1.6],
  [11.6, 960, 500, 1.6], [12.8, 960, 560, 1.48], [17.4, 960, 560, 1.48], [19.9, 960, 520, 1.5], [21.2, 960, 540, 1],
  [22.6, 760, 470, 1.22], [23.8, 1000, 330, 1.35], [25.0, 960, 470, 1.6], [30.6, 960, 470, 1.6], [31.8, 960, 540, 1], [37.4, 960, 540, 1.05],
];
// Cursor waypoints: [t, x, y] or [t, frame, selector].
const CURSOR = [
  [4.9, 1560, 900], [6.9, PAGE[0] + 1105, PAGE[1] + 522], [8.9, PAGE[0] + 1105, PAGE[1] + 522], [10.05, W1, "#c-start"],
  [11.1, W1, "#c-start"], [12.15, W1, "[data-a=details]"], [21.3, W1, "[data-a=details]"], [22.6, 700, 470], [23.3, 760, 480],
  [24.05, PAGE[0] + 920, PAGE[1] + 97], [25.4, PAGE[0] + 920, PAGE[1] + 97], [26.4, W2, "#c-start"],
];
// Clicks: time, and what the click does in the real UI.
const ACTIONS = [
  [7.05, () => {}],
  [10.2, () => doc(W1).querySelector("#c-start").click()],
  [12.3, () => doc(W1).querySelector("[data-a=details]").click()],
  [24.2, () => {}],
  [26.55, () => doc(W2).querySelector("#c-start").click()],
];
const CAPTIONS = [
  [8.1, 12.4, "Click download. SwiftDL takes it from there."],
  [12.8, 17.4, "Eight connections, all working at once."],
  [18.0, 21.2, "Ubuntu, 5.9 GB. Done in three minutes."],
  [24.6, 31.0, "Supports YouTube downloads."],
  [32.4, 37.2, "Every download, in one place."],
];

const point = (w) => (w.length === 3 && typeof w[2] === "string" ? inFrame(w[1], w[2]) || [960, 540] : [w[1], w[2]]);
function cursorAt(t) {
  if (t <= CURSOR[0][0]) return point(CURSOR[0]);
  for (let i = 1; i < CURSOR.length; i++) if (t <= CURSOR[i][0]) {
    const a = point(CURSOR[i - 1]), b = point(CURSOR[i]), k = inOut(prog(t, CURSOR[i - 1][0], CURSOR[i][0]));
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, arc = Math.sin(k * Math.PI) * Math.min(50, len * .1);
    return [lerp(a[0], b[0], k) - (dy / len) * arc, lerp(a[1], b[1], k) + (dx / len) * arc];
  }
  return point(CURSOR.at(-1));
}

let id1 = null, id2 = null, lastT = -1, done = 0, appTick = 0;
const GB = 1024 ** 3, MB = 1024 ** 2;

function feed(t) {
  // Window 1: Ubuntu over eight connections.
  if (id1 != null) {
    const S = 5.9 * GB, complete = t >= 19.9;
    const p1 = lerp(0, .3, smooth(prog(t, 10.4, 17.6))), frac = complete ? 1 : lerp(p1, 1, inOut(prog(t, 17.6, 19.9)));
    const ramp = inOut(prog(t, 10.4, 12.0));
    const speed = complete ? 0 : (1.4 + 27.6 * ramp + Math.sin(t * 5.3) * .6 * ramp + Math.sin(t * 2.1) * .3) * MB;
    const f = simAt(frac);
    win(W1).__video.set(id1, complete
      ? { status: "completed", downloaded: S, size: S, speed: 0, connections: 0, completedAt: Date.now(), segments: [] }
      : { status: "downloading", size: S, downloaded: Math.round(frac * S), speed, connections: t < 10.6 ? 0 : f.segs.filter(([, p, e]) => p < e).length,
          segments: f.segs.map(([s, p, e]) => [Math.round(s * S), Math.round(p * S), Math.round(e * S)]) });
  }
  // Window 2: the YouTube video through yt-dlp.
  if (id2 != null) {
    const S = 412 * MB, merging = t >= 29.3 && t < 30.0, complete = t >= 30.0;
    const f = merging || complete ? 1 : cubic(prog(t, 26.8, 29.3));
    win(W2).__video.set(id2, {
      format: "bv*[height=1080]+ba/b[height=1080]/bv*[height<=1080]+ba/b", size: S, downloaded: Math.round(f * S), connections: merging || complete ? 0 : 1,
      speed: merging || complete ? 0 : (23.8 + Math.sin(t * 4.7) * 1.4) * MB, note: merging ? "Merging video and audio" : null,
      status: complete ? "completed" : "downloading", completedAt: complete ? Date.now() : null,
    });
  }
}

function frame(t) {
  // Title and end cards; the wallpaper drifts slowly throughout.
  const tOut = cubic(prog(t, 3.2, 4.0));
  css($("title"), { opacity: 1 - tOut, visibility: tOut < 1 ? "visible" : "hidden" });
  show($("tI"), t, .2, 99, { scale: .12, y: 10 }); show($("tN"), t, .55, 99); show($("tL"), t, 1.1, 99, { y: 16 });
  const eIn = cubic(prog(t, 37.6, 38.4));
  css($("end"), { opacity: eIn * (1 - cubic(prog(t, 43.3, 44))), visibility: eIn > 0 ? "visible" : "hidden" });
  show($("eI"), t, 37.9, 99, { scale: .12, y: 10 }); show($("eN"), t, 38.2, 99); show($("eL"), t, 38.8, 99, { y: 16 }); show($("eU"), t, 39.4, 99, { y: 12 });
  $("wall").style.transform = `translate(${Math.sin(t * .11) * 30}px, ${Math.cos(t * .09) * 20}px) scale(1.04)`;

  // The screen gives way to the end card.
  const sOut = cubic(prog(t, 37.2, 38.0));
  css($("cam"), { opacity: 1 - sOut, filter: sOut > 0 && sOut < 1 ? `blur(${sOut * 12}px)` : "none" });
  let [cx, cy, s] = keys(CAM, t);
  cx = clamp(cx, 960 / s, 1920 - 960 / s); cy = clamp(cy, 540 / s, 1080 - 540 / s);
  $("cam").style.transform = `translate(${960 - cx * s}px, ${540 - cy * s}px) scale(${s})`;

  // Browser: opens, switches to YouTube, gives way to SwiftDL's main window.
  const bIn = expo(prog(t, 3.3, 4.3)), bOut = cubic(prog(t, 31.0, 31.7)), bOp = bIn * (1 - bOut);
  css($("chrome"), { opacity: bOp, visibility: bOp > 0 ? "visible" : "hidden", transform: `translateY(${(1 - bIn) * 70}px) scale(${lerp(.94, 1, bIn) - bOut * .03})` });
  const yt = inOut(prog(t, 21.4, 21.9));
  $("pg1").style.opacity = 1 - yt; $("pg2").style.opacity = yt;
  const onYT = t >= 21.65;
  $("tabtitle").textContent = onYT ? "Big Buck Bunny 60fps 4K - Official Blender Foundation Short Film" : "Download Ubuntu Desktop | Ubuntu";
  $("favicon").src = onYT ? "out/pages/youtube-icon.png" : "out/pages/ubuntu-icon.png";
  $("url").innerHTML = onYT ? `youtube.com<span class="path">/watch?v=aqz-KE-bpKQ</span>` : `ubuntu.com<span class="path">/download/desktop</span>`;
  show($("vbtn"), t, 23.15, 31.0, { y: -6, blur: 4, inDur: .3 });

  pop(W1, t, 7.25, 21.1);
  pop(W2, t, 24.4, 31.2);
  const aIn = expo(prog(t, 31.4, 32.5));
  css(APP, { opacity: aIn, visibility: aIn > 0 ? "visible" : "hidden", transform: `translateY(${(1 - aIn) * 70}px) scale(${lerp(.95, 1, aIn)})` });

  // Cursor and clicks.
  const [mx, my] = cursorAt(t);
  const cVis = expo(prog(t, 4.6, 5.0)) * (1 - cubic(prog(t, 30.8, 31.2)));
  const near = ACTIONS.map((a) => a[0]).find((c) => t >= c - .06 && t < c + .45);
  const down = near ? Math.sin(prog(t, near - .06, near + .14) * Math.PI) : 0;
  css($("cursor"), { opacity: cVis, transform: `translate(${mx}px, ${my}px) scale(${1 - down * .12})` });
  const rk = near ? prog(t, near, near + .45) : 1;
  css($("ring"), { left: `${mx + 1}px`, top: `${my + 1}px`, opacity: near ? (1 - rk) * cVis : 0, transform: `scale(${.35 + cubic(rk) * .9})` });

  const cap = CAPTIONS.find(([a, b]) => t >= a && t < b);
  if (cap) { $("cap").textContent = cap[2]; show($("cap"), t, cap[0], cap[1], { y: 26, x: "translateX(-50%)" }); }
  else css($("cap"), { opacity: 0, visibility: "hidden" });
  show($("ff"), t, 17.7, 19.9, { y: -14, x: "translateX(-50%)" });
}

// The film clicks real UI, so it plays forward: each step fires the clicks
// it passes, feeds the windows, then draws.
window.seek = async (t) => {
  if (t < lastT) throw new Error("the film only plays forward");
  for (let s = Math.max(lastT, 0); s <= t + 1e-9; s += 1 / 30) {
    const step = Math.min(s, t);
    while (done < ACTIONS.length && ACTIONS[done][0] <= step) {
      ACTIONS[done][1]();
      done++;
      await new Promise((r) => setTimeout(r, 0)); // let the UI's async handlers run
      if (id1 == null && doc(W1).defaultView.__video.last()?.filename?.startsWith("ubuntu")) id1 = win(W1).__video.last().id;
      if (id2 == null && win(W2).__video.last()?.filename?.includes("Bunny")) id2 = win(W2).__video.last().id;
    }
    while (appTick < Math.floor(step * 2)) { appTick++; if (step > 31) win(APP).__video.step(); }
    if (s >= t) break;
  }
  feed(t);
  await new Promise((r) => setTimeout(r, 0));
  frame(t);
  lastT = t;
};
</script>
