<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SwiftDL</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="logo.svg" alt="" width="28" height="28">
    <span class="id"><b>SwiftDL</b><span class="status" id="status"><i></i><span>Checking</span></span></span>
    <button id="open" class="icon" title="Open SwiftDL">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </button>
  </header>

  <main id="main">
    <section id="found" hidden>
      <div class="label">On this page</div>
      <div id="media"></div>
    </section>

    <label class="row">
      <span class="txt">Catch downloads</span>
      <span class="switch"><input type="checkbox" id="enabled"><i></i></span>
    </label>
    <label class="row" id="site-row">
      <span class="txt">On <span id="site" class="host"></span></span>
      <span class="switch"><input type="checkbox" id="site-on"><i></i></span>
    </label>
    <label class="row">
      <span class="txt">Skip files under</span>
      <span class="select"><select id="min-size">
        <option value="0">Off</option>
        <option value="512">512 KB</option>
        <option value="1024">1 MB</option>
        <option value="5120">5 MB</option>
        <option value="20480">20 MB</option>
      </select></span>
    </label>

    <p class="hint">Hold <kbd>Alt</kbd> while clicking to download in the browser</p>
  </main>

  <div class="missing" id="missing" hidden>
    <b>Can't reach SwiftDL</b>
    <span>Open the app once. If it's already open, restart the browser.</span>
    <a href="https://github.com/harshsinghsv/swiftdl/releases/latest" target="_blank" class="btn">Download SwiftDL</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
