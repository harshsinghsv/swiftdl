# Push a tag like v0.2.0 to build installers for every platform and attach
# them, plus the browser extension, to a draft GitHub release whose notes
# come from CHANGELOG.md. Review the draft on GitHub, then publish it.
# To rebuild an existing tag, run this workflow by hand and give the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # One release for all builds, so parallel jobs don't race to create it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install
          - **Windows:** `SwiftDL_*_x64-setup.exe` for x64 or `SwiftDL_*_arm64_setup.exe` for ARM64 (no admin rights needed)
          - **macOS:** `SwiftDL_*_universal.dmg`
          - **Linux:** `.AppImage`, `.deb` or `.rpm`
          - **Browser extension:** included with the app. Open SwiftDL and click *Add the extension* for a short guide (Chrome, Edge, Brave, Vivaldi and Firefox). `swiftdl-extension.zip` (Chromium browsers) and `swiftdl-firefox.xpi` (Firefox) have the same files.
          EOF
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Take the id from the create response; listing releases right
          # after creating one can miss the new draft.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases"             -f tag_name="$TAG" -f name="SwiftDL $TAG" -F draft=true -F body=@notes.md --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  app:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: windows-11-arm
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Select clang-cl for Windows ARM64
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: '"CC=clang-cl" >> $env:GITHUB_ENV'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the interface
        working-directory: app
        run: npm ci && npm run build

      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform != 'windows-11-arm'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          tauriScript: npx --yes @tauri-apps/cli@2
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Build Windows ARM64 installer
        if: matrix.platform == 'windows-11-arm'
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --ci ${{ matrix.args }}

      - name: Upload Windows ARM64 installer
        if: matrix.platform == 'windows-11-arm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Older updaters pick the first name ending in -setup.exe.
          $installer = Get-Item 'target/aarch64-pc-windows-msvc/release/bundle/nsis/SwiftDL_*_arm64-setup.exe'
          $name = $installer.Name -replace '-setup\.exe$', '_setup.exe'
          $asset = Rename-Item -LiteralPath $installer.FullName -NewName $name -PassThru
          gh release upload "$env:TAG" "$($asset.FullName)" --clobber

  extension:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Zip and attach the extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd extension && zip -r ../swiftdl-extension.zip .)
          # The Firefox add-on: the same files with Firefox's manifest
          # (keep in step with app/src-tauri/build.rs).
          cp -r extension firefox
          jq 'del(.key) | .background = {scripts: ["background.js"]}
              | .browser_specific_settings = {gecko: {id: "swiftdl@harshhh.me", strict_min_version: "140.0",
                  data_collection_permissions: {required: ["none"]}}}' \
            extension/manifest.json > firefox/manifest.json
          (cd firefox && zip -r ../swiftdl-firefox.xpi .)
          gh release upload "$TAG" swiftdl-extension.zip swiftdl-firefox.xpi --clobber
