name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The interface is TypeScript, built by Vite into app/dist, which the
      # app embeds at compile time.
      - name: Build the interface
        working-directory: app
        run: npm ci && npm run build
      - run: cargo test --workspace
      - run: cargo build -p swiftdl-app

  # The app has macOS-only code (opening magnet links and .torrent files);
  # make sure it compiles there too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The interface is TypeScript, built by Vite into app/dist, which the
      # app embeds at compile time.
      - name: Build the interface
        working-directory: app
        run: npm ci && npm run build
      - run: cargo check -p swiftdl-app

  windows-arm64:
    runs-on: windows-11-arm
    env:
      CC: clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the interface
        working-directory: app
        run: npm ci && npm run build
      - run: cargo test -p swiftdl-app update::tests
