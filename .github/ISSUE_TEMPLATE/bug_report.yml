name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a download from ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SwiftDL version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser (for extension issues)
      placeholder: "Chrome 141"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the download link (if public), log lines.
