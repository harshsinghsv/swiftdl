[package]
name = "swiftdl-cli"
description = "Command-line front end for the swiftdl engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "swiftdl"
path = "src/main.rs"

[dependencies]
swiftdl-engine = { path = "../engine" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
